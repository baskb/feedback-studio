name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          for f in plugins/feedback-studio/lib/*.mjs plugins/feedback-studio/bin/*.mjs plugins/feedback-studio/hooks/*.mjs plugins/feedback-studio/public/overlay/*.mjs; do node --check "$f" || exit 1; done

      - name: Validate manifests
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('plugins/feedback-studio/.claude-plugin/plugin.json','utf8'))"

      - name: Unit tests
        run: node --test plugins/feedback-studio/test/store.test.mjs plugins/feedback-studio/test/markers.test.mjs plugins/feedback-studio/test/narration.test.mjs plugins/feedback-studio/test/anchor.test.mjs plugins/feedback-studio/test/interop.test.mjs

      - name: HTTP smoke test
        run: node plugins/feedback-studio/test/smoke.mjs

      - name: MCP smoke test
        run: node plugins/feedback-studio/test/mcp-smoke.mjs
