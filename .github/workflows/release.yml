name: Release

# Push a version tag (v1.2.3) and this publishes to npm and cuts the GitHub Release,
# so the two channels are always in sync. The easy path is `npm run release:patch`,
# which bumps every manifest, tags, and pushes for you.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # All three version files must agree with the tag, not just package.json:
      # a stale plugin.json ships a plugin that reports the wrong version, and a
      # stale marketplace.json offers the wrong one for install.
      - name: Tag must match every version file
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG"
          off=0
          compare() {
            echo "  $1 = $2"
            if [ "$2" != "$TAG" ]; then
              echo "::error::$1 says $2, but the tag is v$TAG. Bump it (npm run release:patch does all of them) and re-tag."
              off=1
            fi
          }
          compare package.json "$(node -p "require('./package.json').version")"
          compare plugins/feedback-studio/.claude-plugin/plugin.json "$(node -p "require('./plugins/feedback-studio/.claude-plugin/plugin.json').version")"
          compare .claude-plugin/marketplace.json "$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")"
          test "$off" = "0"

      # Gate the publish on the SAME suite CI runs, so a release can't ship a
      # regression that the per-PR checks would have caught.
      - name: Unit tests
        run: node --test plugins/feedback-studio/test/store.test.mjs plugins/feedback-studio/test/markers.test.mjs plugins/feedback-studio/test/narration.test.mjs plugins/feedback-studio/test/anchor.test.mjs plugins/feedback-studio/test/interop.test.mjs plugins/feedback-studio/test/nav.test.mjs plugins/feedback-studio/test/sort.test.mjs plugins/feedback-studio/test/i18n.test.mjs plugins/feedback-studio/test/history.test.mjs

      # Same as CI: install the two helpers the server would fetch lazily, so the
      # --md and vendor-route checks in the smoke test run for real rather than skip.
      - name: Install the lazy helpers the smoke test checks
        run: |
          mkdir -p ~/.feedback-studio/deps
          echo '{"name":"feedback-studio-deps","private":true}' > ~/.feedback-studio/deps/package.json
          cd ~/.feedback-studio/deps && npm install marked@^12 html-to-image@^1 --no-audit --no-fund --ignore-scripts --loglevel=error

      - name: HTTP smoke test
        run: node plugins/feedback-studio/test/smoke.mjs

      - name: MCP smoke test
        run: node plugins/feedback-studio/test/mcp-smoke.mjs

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
